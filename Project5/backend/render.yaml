services:
  - type: web
    name: medibook-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: medibook-postgres
          property: connectionString
      - key: CLIENT_URL
        value: https://medibook-frontend.vercel.app

databases:
  - name: medibook-postgres
    plan: free
    databaseName: medibook_db
    user: postgres

